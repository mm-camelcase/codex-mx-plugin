    <g transform="translate(660 30)"><circle r="4.5" fill="none" stroke="#8b96a6" stroke-width="1.5"/><text x="16" y="5" fill="#a4adbb">Unknown</text></g>
    <text x="872" y="35" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#5c6675">KEY STATES</text>

  <rect x="0.5" y="0.5" width="899" height="59" rx="16" fill="#0d1117" stroke="#2a313c"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="#e6ebf1">
    <g transform="translate(44 30)"><circle r="9" fill="#f4ba6b" opacity=".22"/><circle r="5" fill="#f4ba6b"/><text x="16" y="5">Needs you</text></g>
    <g transform="translate(194 30)"><circle r="9" fill="#92bdfc" opacity=".22"/><circle r="5" fill="#92bdfc"/><text x="16" y="5">Working</text></g>
    <g transform="translate(330 30)"><circle r="9" fill="#b7f398" opacity=".22"/><circle r="5" fill="#b7f398"/><text x="16" y="5">Done</text></g>
    <g transform="translate(444 30)"><circle r="9" fill="#fa9393" opacity=".22"/><circle r="5" fill="#fa9393"/><text x="16" y="5">Error</text></g>

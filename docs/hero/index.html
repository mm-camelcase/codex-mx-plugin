<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Agent Keypad — hero scene</title>
  <style>
    :root{--attention:#f4ba6b;--working:#92bdfc;--done:#b7f398;--error:#fa9393;--idle:#8b96a6}
    html,body{margin:0;background:#0d1117;overflow:hidden}
    .record,.record body{background:transparent}
    .card .copy,.card .legend{display:none}
    #stage{position:relative;width:1200px;height:600px;transform-origin:0 0;overflow:hidden;border-radius:22px;background:#0d1117;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e6ebf1}
    canvas{position:absolute;inset:0;display:block}
    .copy{position:absolute;left:64px;top:0;bottom:0;width:430px;display:flex;flex-direction:column;justify-content:center}
    .eyebrow{font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.6px;color:#8b96a6;margin:0 0 18px;display:flex;align-items:center;gap:9px}
    .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--done);box-shadow:0 0 10px var(--done)}
    h1{font-size:52px;line-height:1.06;letter-spacing:-2.2px;font-weight:600;margin:0 0 16px}
    .tagline{font-size:19px;line-height:1.5;color:#a4adbb;margin:0 0 34px}
    #crumbs{font:500 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;color:#6b7686;display:flex;gap:10px;align-items:center;height:34px;white-space:nowrap}
    #crumbs b{font-weight:500;color:#6b7686}
    #crumbs b:last-child{color:#0d1117;background:var(--done);padding:7px 10px;border-radius:5px}
    .legend{position:absolute;left:64px;bottom:34px;display:flex;gap:18px;font-size:12px;color:#8b96a6}
    .legend span{display:flex;align-items:center;gap:6px}
    .legend i{width:7px;height:7px;border-radius:50%}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="scene" width="1200" height="600"></canvas>
    <div class="copy">
      <p class="eyebrow"><i></i> A CODEX HARDWARE EXPERIMENT</p>
      <h1>Codex Agent<br>Keypad</h1>
      <p class="tagline">Your agents. Within reach.</p>
      <div id="crumbs"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--attention)"></i>Needs you</span>
      <span><i style="background:var(--working)"></i>Working</span>
      <span><i style="background:var(--done)"></i>Done</span>
      <span><i style="background:var(--error)"></i>Error</span>
      <span><i style="background:var(--idle)"></i>Idle</span>
    </div>
  </div>
  <script type="module" src="scene.js"></script>
</body>
</html>
